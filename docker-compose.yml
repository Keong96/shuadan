version: '3.8'

services:
  # Node.js 应用
  app:
    build: .
    restart: always
    # 重点：把宿主机的 3002 端口映射到容器的 3000
    # 这样 Caddy 才能通过 3002 找到它
    ports:
      - "3002:3000"
    environment:
      # 数据库连接字符串 (注意数据库名是 myapp_a)
      - DB=postgresql://postgres:MySecretPass123@db:5432/myapp_b
      - TOKEN_KEY=SecretKeyForClientA
      - TZ=Asia/Kuala_Lumpur
      - PORT=3000
    depends_on:
      - db

  # 数据库 (PostgreSQL)
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MySecretPass123
      POSTGRES_DB: myapp_b  # 独立的数据库名
    volumes:
      # 数据持久化，防止重启丢失
      - ./pgdata:/var/lib/postgresql/data