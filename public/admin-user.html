  <script>
    const token = localStorage.getItem("token");
    if(!token)
    {
      window.stop();
      window.location.href = `${window.location.origin}/index.html`;
    }

    const decoded_token = jwt_decode(token);
    if (decoded_token.exp < Math.floor(Date.now() / 1000) || (decoded_token.userType !== 0 && decoded_token.userType !== 1))
    {
      localStorage.removeItem('token');
      window.location.href = '/index.html';
      window.stop()
    }

    let currentPage = 1;
    const limit = 50;
    let currentSearch = '';

    function loadUsers(page = 1, search = '') {
      axios.get(`${window.location.origin}/users?page=${page}&limit=${limit}&search=${encodeURIComponent(search)}`, {
        headers: { Authorization: `Bearer ${token}` }
      })
      .then(res => {
        if (!res.data.status) return;
        
        const users = res.data.data;
        const tbody = document.getElementById('userBody');
        if (!tbody) return;

        let html = '';
        for (let i = 0; i < users.length; i++) {
          const user = users[i];

          const statusClass = user.status ? 'btn-success' : 'btn-danger';
          const statusText = user.status ? '启用' : '禁用';

          const canWithdrawClass = user.can_withdraw ? 'btn-success' : 'btn-danger';
          const canWithdrawText = user.can_withdraw ? '允许提现' : '禁止提现';
          const canDoTaskClass = user.can_do_task ? 'btn-success' : 'btn-danger';

    function renderPagination({ page, totalPages }) {
      const container = document.getElementById('pagination');
      container.innerHTML = '';

      if (totalPages <= 1) return;

      const buttons = [];
      const range = 2; 

      buttons.push(1);
      if (page - range > 2) buttons.push('...');

      for (let i = Math.max(2, page - range); i <= Math.min(totalPages - 1, page + range); i++) {
        buttons.push(i);
      }

      if (page + range < totalPages - 1) buttons.push('...');
      if (totalPages > 1) buttons.push(totalPages);

      buttons.forEach(item => {
        if (item === '...') {
          container.innerHTML += `<span class="btn btn-outline-secondary disabled border-0">...</span>`;
        } else {
          container.innerHTML += `
            <button class="btn ${item === page ? 'btn-primary' : 'btn-outline-primary'} me-1" onclick="loadUsers(${item}, '${currentSearch}')">
              ${item}
            </button>`;
        }
      });
    }

    function makeRowEditable(btn) {
      const row = btn.closest('tr');
      const id = row.dataset.id;
      const cells = row.querySelectorAll('td');
      const table = row.closest('table');

      // 列索引（0-based）
      // 0: #, 1: 照片, 2: 名称, 3: 完成时间, 4: 产品价格, 5: 佣金比例, 6: 佣金, 7: 操作
      row.dataset.originalAmount = (cells[4].textContent || '').replace('$', '').trim();
      row.dataset.originalRate = (cells[5].textContent || '').replace('%', '').trim();
      row.dataset.originalCommission = (cells[6].textContent || '').replace('$', '').trim();

      const amountCell = cells[4];
      const commissionRateCell = cells[5];
      const commissionCell = cells[6];

      const originalAmount = parseFloat(row.dataset.originalAmount) || 0;
      const originalRate = parseFloat(row.dataset.originalRate) || 0; // already in percent units (e.g. 10 => 10%)

      // 重新计算佣金并刷新单元格与总计
      function recalcCommission() {
        const amountInput = row.querySelector('td:nth-child(5) input'); // 5th column (1-based)
        const rateInput = row.querySelector('td:nth-child(6) input');   // 6th column (1-based)
        const amount = parseFloat(amountInput ? amountInput.value : 0) || 0;
        const rate = parseFloat(rateInput ? rateInput.value : 0) || 0; // percent
        const commission = amount * (rate / 100);
        commissionCell.textContent = `$${commission.toFixed(2)}`;
        if (typeof updateCycleCommission === 'function') updateCycleCommission(table);
      }

      // amount input (产品价格)
      amountCell.innerHTML = `
        <input type="number" step="0.01" class="form-control form-control-sm"
              value="${originalAmount.toFixed(2)}" oninput="this.closest('tr').recalcCommission()">
      `;

      // rate input (佣金比例) 显示为百分号后缀
      commissionRateCell.innerHTML = `
        <div class="input-group input-group-sm">
          <input type="number" step="0.01" class="form-control form-control-sm"
                value="${originalRate.toFixed(2)}" oninput="this.closest('tr').recalcCommission()">
          <span class="input-group-text">%</span>
        </div>
      `;

      // 挂载函数，供 oninput 调用
      row.recalcCommission = recalcCommission;

      // 替换操作按钮为保存/取消
      cells[7].innerHTML = `
        <button class="btn btn-outline-success btn-sm" onclick="saveRow(this, '${id}')">
          <i class="bi bi-check-lg"></i>
        </button>
        <button class="btn btn-outline-danger btn-sm" onclick="cancelEdit(this)">
          <i class="bi bi-x-lg"></i>
        </button>
      `;

      // 立即计算一次，确保佣金显示正确
      recalcCommission();
    }
    
    function saveRow(btn, id) {
      const row = btn.closest('tr');
      const table = row.closest('table');
      const inputs = row.querySelectorAll('input');
      const newAmount = parseFloat(inputs[0].value) || 0;
      const newRate = parseFloat(inputs[1].value) || 0;

      const newCommission = newAmount * newRate / 100;

      axios.put(`/orders/${id}`, {
        amount: newAmount,
        commission_rate: newRate
      }, {
        headers: { Authorization: `Bearer ${localStorage.getItem('token')}` }
      }).then(res => {
        // 更新行内容
        const cells = row.querySelectorAll('td');
        cells[4].textContent = "$" + newAmount.toFixed(2);
        cells[5].textContent = newRate.toFixed(2) + "%";
        cells[6].textContent = "$" + newCommission.toFixed(2);

        // 恢复按钮
        cells[7].innerHTML = `
          <button class="btn btn-outline-warning btn-sm" onclick="makeRowEditable(this)">
            <i class="bi bi-pencil-square"></i>
          </button>
          <button class="btn btn-outline-danger btn-sm" onclick="deleteOrder(${id})">
            <i class="bi bi-trash"></i>
          </button>
        `;

        // 更新当前行的数据属性
        row.dataset.originalAmount = newAmount.toFixed(2);
        row.dataset.originalRate = newRate.toFixed(2);
        row.dataset.originalCommission = newCommission.toFixed(2);

        // 重新计算整个周期总佣金（仅计算已完成的）
        updateCycleCommission(table);
      }).catch(err => {
        console.error(err);
        alert('保存失败');
      });
    }

    function cancelEdit(btn) {
      const row = btn.closest('tr');
      const cells = row.querySelectorAll('td');

      cells[4].textContent = "$"+row.dataset.originalAmount;     // 产品价格
      cells[5].textContent = row.dataset.originalRate+"%";       // 佣金比例
      cells[6].textContent = "$"+row.dataset.originalCommission; // 佣金
      
      cells[7].innerHTML = `
        <button class="btn btn-outline-warning btn-sm" onclick="makeRowEditable(this)">
          <i class="bi bi-pencil-square"></i>
        </button>
        <button class="btn btn-outline-danger btn-sm" onclick="deleteOrder(${row.dataset.id})">
          <i class="bi bi-trash"></i>
        </button>
      `;
    }

    function updateCycleCommission(table) {
      const rows = table.querySelectorAll('tbody tr');
      let total = 0;

      rows.forEach(r => {
        const cells = r.querySelectorAll('td');
        if (cells.length >= 7 && !r.classList.contains('table-success')) {
          const completedText = (cells[3]?.textContent || "").trim();
          // 只计算“已完成”的行
          if (completedText && completedText !== "未完成") {
            const val = parseFloat((cells[6].textContent || "").replace('$', '').trim());
            if (!isNaN(val)) total += val;
          }
        }
      });

      const summaryRow = table.querySelector('tr.table-success td:last-child');
      if (summaryRow) summaryRow.textContent = total.toFixed(2);
    }

      const referred_by = document.getElementById('demoReferredBy').value.trim();
      const balance = parseFloat(document.getElementById('demoBalance').value || 0);
      const commission_rate = parseFloat(document.getElementById('demoCommissionRate').value || 0);

      if (!username || !password) {
        alert('用户名和密码不能为空');
        return;
      }

      axios.post('/create-demo', { username, password, referred_by, balance, commission_rate}, {
        headers: { Authorization: `Bearer ${token}` }
      })
      .then(res => {
        if (!res.data.status) {
          alert(res.data.message || '创建测试账号失败');
          return;
        }
        location.reload();
      })
      .catch(err => {
        console.error(err);
        alert('创建测试账号失败。');
      });
    }

    // 🎰 Lucky Draw Modal 控制逻辑
    const luckyDrawModal = document.getElementById('luckyDrawModal');

    // 打开 modal 时载入数据
    luckyDrawModal.addEventListener('show.bs.modal', event => {
      const button = event.relatedTarget;
      luckyDrawModal.dataset.userId = button.dataset.id; // 绑定 userId
      const raw = button?.dataset?.setting || '[]';
      let data = [];
      try {
        data = JSON.parse(String(raw).replace(/&quot;/g, '"') || '[]');
      } catch {
        data = [];
      }

      const tbody = luckyDrawModal.querySelector('#luckyDrawTable tbody');
      tbody.innerHTML = '';

      data.forEach((item, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td><input type="text" class="form-control form-control-sm name-input bg-dark text-white border-secondary text-center" value="${(item.name || '').replace(/"/g, '&quot;')}"></td>
          <td><input type="number" class="form-control form-control-sm rate-input bg-dark text-white border-secondary text-center" value="${item.rate || 0}" min="0" step="0.01"></td>
          <td><button type="button" class="btn btn-sm btn-danger remove-row"><i class="bi bi-trash"></i> 删除</button></td>
        `;
        tbody.appendChild(tr);
      });
    });

    // 新增奖项
    document.getElementById('addLuckyRow').addEventListener('click', () => {
      const tbody = document.querySelector('#luckyDrawTable tbody');
      const index = tbody.children.length + 1;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${index}</td>
        <td><input type="text" class="form-control form-control-sm name-input bg-dark text-white border-secondary text-center" value=""></td>
        <td><input type="number" class="form-control form-control-sm rate-input bg-dark text-white border-secondary text-center" value="0" min="0" step="0.01"></td>
        <td><button type="button" class="btn btn-sm btn-danger remove-row"><i class="bi bi-trash"></i> 删除</button></td>
      `;
      tbody.appendChild(tr);
    });

    // 删除奖项（事件委托）
    document.addEventListener('click', e => {
      const btn = e.target.closest('.remove-row');
      if (!btn) return;
      const tr = btn.closest('tr');
      if (!tr) return;
      tr.remove();
      // 重新编号
      document.querySelectorAll('#luckyDrawTable tbody tr').forEach((r, i) => {
        const firstTd = r.querySelector('td');
        if (firstTd) firstTd.textContent = i + 1;
      });
    });

    // 保存按钮
    document.getElementById('saveLuckyDraw').addEventListener('click', async () => {
      const rows = document.querySelectorAll('#luckyDrawTable tbody tr');
      const result = Array.from(rows).map(r => ({
        name: (r.querySelector('.name-input')?.value || '').trim(),
        rate: parseFloat(r.querySelector('.rate-input')?.value) || 0
      }));

      const json = JSON.stringify(result);
      const userId = luckyDrawModal.dataset.userId || null;

      try {
        await axios.post('/update-lucky-draw', {
          userId,
          lucky_draw_setting: json
        }, { headers: { Authorization: `Bearer ${token}` } });

        alert('保存成功');
        const modal = bootstrap.Modal.getInstance(luckyDrawModal);
        if (modal) modal.hide();

        // 同步更新按钮上的 data-setting，避免重新加载
        const btn = document.querySelector(`[data-bs-target="#luckyDrawModal"][data-id="${userId}"]`);
        if (btn) btn.dataset.setting = json.replace(/"/g, '&quot;');
      } catch (err) {
        console.error('保存失败:', err);
        alert('保存失败');
      }
    });

    function Logout() {
      localStorage.removeItem("token");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
