<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>用户管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body {
      margin: 0;
      padding-top: 56px;
      font-family: system-ui, sans-serif;
      background-color: #1e1e2f;
      color: #f0f0f0;
    }

    .navbar {
      background-color: #27293d;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .navbar-brand {
      color: #f0f0f0;
    }

    .navbar-toggler {
      border-color: rgba(255, 255, 255, 0.4);
    }

    .navbar-toggler-icon {
      filter: invert(1);
    }

    .wrapper {
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 992px) {
      .wrapper {
        flex-direction: row;
      }
    }

    .sidebar {
      background-color: #2c2f48;
      border-bottom: 1px solid #333;
    }

    @media (min-width: 992px) {
      .sidebar {
        position: sticky;
        top: 56px;
        height: calc(100vh - 56px);
        width: 250px;
        border-right: 1px solid #333;
        overflow-y: auto;
      }
    }

    .sidebar .nav-link {
      color: #ccc;
      margin: 0.5rem 0;
    }

    .sidebar .nav-link.active,
    .sidebar .nav-link:hover {
      background-color: #3e4161;
      color: #fff;
      border-radius: 5px;
    }

    .main-content {
      flex-grow: 1;
      padding: 20px;
      background-color: #1e1e2f;
    }

    .card {
      background-color: #2a2d45;
      border: none;
      color: #fff;
    }

    .btn-primary {
      background-color: #5c6bc0;
      border-color: #5c6bc0;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #3f51b5;
      border-color: #3f51b5;
    }
    input[readonly] {
      border: 0 !important;
      box-shadow: none !important;
      background-color: transparent; /* 可选，若你不想要背景 */
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg px-4">
    <a class="navbar-brand text-white" href="index.html">用户管理</a>
    <button
      class="navbar-toggler ms-auto"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#sidebarMenu"
      aria-controls="sidebarMenu"
      aria-expanded="false"
      aria-label="Toggle sidebar"
      id="sidebarToggle"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
  </nav>

  <div class="wrapper">
    <div class="sidebar collapse d-lg-block" id="sidebarMenu">
      <nav class="nav flex-column px-3 pt-4">
        <a class="nav-link" href="admin-dashboard.html"><i class="bi bi-speedometer2 me-2"></i>控制面板</a>
        <a class="nav-link active" href="/admin-user.html"><i class="bi bi-box-seam me-2"></i>用户管理</a>
        <a class="nav-link" href="/admin-task.html"><i class="bi bi-box-seam me-2"></i>产品管理</a>
        <a class="nav-link" href="/admin-transaction.html"><i class="bi bi-bank me-2"></i>交易明细</a>
        <a class="nav-link" href="/admin-loan.html"><i class="bi bi-cash me-2"></i>贷款申请</a>
        <a class="nav-link" href="/admin-draw-record.html"><i class="bi bi-gift-fill me-2"></i>抽奖记录</a>
        <a class="nav-link" href="/admin-wallet.html"><i class="bi bi-wallet me-2"></i>钱包查询</a>
        <a class="nav-link" href="/admin-setting.html"><i class="bi bi-receipt me-2"></i>全局设定</a>
        <a class="nav-link" href="#" onclick="Logout()"><i class="bi bi-box-arrow-right me-2"></i>登出</a>
      </nav>
    </div>

    <div class="main-content">
      <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="mb-0">用户管理</h3>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createDemoModal">
            创建测试账号
          </button>
        </div>
    
        <div class="card p-3">
          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle">
              <thead>
                <tr>
                  <th class="text-nowrap">#</th>
                  <th class="text-nowrap">用户名</th>
                  <th class="text-nowrap">VIP等级</th>
                  <th class="text-nowrap">信用积分</th>
                  <th class="text-nowrap">余额</th>
                  <th class="text-nowrap">状态</th>
                  <th class="text-nowrap">任务进度</th>
                  <th class="text-nowrap">操作</th>
                </tr>
              </thead>
              <tbody id="userBody">

              </tbody>  
            </table>
          </div>

           <!-- Pagination Controls -->
           <div class="paginator" style="margin-top: 10px; text-align: center;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-bottom border-secondary">
          <h5 class="modal-title" id="userModalLabel">修改用户资料</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="userForm">
          <div class="modal-body">

            <div class="mb-3 row">
              <label for="editUserName" class="col-sm-4 col-form-label">用户名</label>
              <div class="col-sm-8">
                <input id="editUserName" name="username" type="text" class="form-control bg-dark text-white border-secondary" readonly>
              </div>
            </div>

            <div class="mb-3 row">
              <label for="editReferralCode" class="col-sm-4 col-form-label">邀请码</label>
              <div class="col-sm-8">
                <input id="editReferralCode" name="referral_code" type="text" class="form-control bg-dark text-white border-secondary" readonly>
              </div>
            </div>

            <div class="mb-3 row">
              <label for="editUserBalance" class="col-sm-4 col-form-label">余额</label>
              <div class="col-sm-8">
                <input id="editUserBalance" name="balance" type="number" step="0.01" class="form-control bg-dark text-white border-secondary" readonly>
              </div>
            </div>

            <div class="mb-3 row">
              <label for="editVipLevel" class="col-sm-4 col-form-label">VIP 等级</label>
              <div class="col-sm-8">
                <select id="editVipLevel" name="vip_level" class="form-control bg-dark text-white border-secondary">
                  <option value="BASIC">BASIC</option>
                  <option value="ADVANCED">ADVANCED</option>
                  <option value="PRO">PRO</option>
                  <option value="ELITE">ELITE</option>
                  <option value="LEGEND">LEGEND</option>
                </select>
              </div>
            </div>

            <div class="mb-3 row">
              <label for="editCreditScore" class="col-sm-4 col-form-label">信用积分</label>
              <div class="col-sm-8">
                <input id="editCreditScore" name="creditScore" type="text" class="form-control bg-dark text-white border-secondary">
              </div>
            </div>

            <div class="mb-3 row">
              <label for="editPassword" class="col-sm-4 col-form-label">密码</label>
              <div class="col-sm-8">
                <input id="editPassword" name="password" type="text" class="form-control bg-dark text-white border-secondary">
              </div>
            </div>

            <div class="mb-3 row">
              <label for="editSecurityPin" class="col-sm-4 col-form-label">安全码</label>
              <div class="col-sm-8">
                <input id="editSecurityPin" name="security_pin" type="text" class="form-control bg-dark text-white border-secondary">
              </div>
            </div>

            <div class="mb-3 row">
              <label for="editUserPhone" class="col-sm-4 col-form-label">钱包地址 / 手机号码</label>
              <div class="col-sm-8">
                <input id="editUserPhone" name="phone" type="text" class="form-control bg-dark text-white border-secondary" readonly>
              </div>
            </div>

            <div class="mb-3 row">
              <label for="editUserEmail" class="col-sm-4 col-form-label">电子邮箱</label>
              <div class="col-sm-8">
                <input id="editUserEmail" name="email" type="email" class="form-control bg-dark text-white border-secondary">
              </div>
            </div>

            <div class="mb-3 row">
              <label for="editUserGender" class="col-sm-4 col-form-label">性别</label>
              <div class="col-sm-8">
                <input id="editUserGender" name="gender" type="text" class="form-control bg-dark text-white border-secondary">
              </div>
            </div>

            <div class="mb-3 row">
              <label for="editUserDob" class="col-sm-4 col-form-label">出生日期</label>
              <div class="col-sm-8">
                <input id="editUserDob" name="dob" type="date" class="form-control bg-dark text-white border-secondary">
              </div>
            </div>

          </div>
          <div class="modal-footer border-top border-secondary">
            <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">取消</button>
            <button type="button" id="editSaveBtn" class="btn btn-light text-dark" onclick="editUser()">储存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Task Modal -->
  <div class="modal fade" id="cycleOrdersModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content bg-dark text-white">
        <div class="modal-header">
          <h5 class="modal-title">任务设置 & 订单列表</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <h3>任务设置</h3>
          <hr>
          <!-- 设置表单 -->
          <div class="mb-2 d-flex align-items-center">
            <label class="form-label me-2 mb-0" style="width: 100px;">任务环大小</label>
            <input type="number" id="modalCycleSize" class="form-control form-control-sm">
          </div>

          <div class="mb-2 d-flex align-items-center">
            <label class="form-label me-2 mb-0" style="width: 100px;">卡单位置</label>
            <input type="text" id="modalBlockers" class="form-control form-control-sm">
          </div>

          <div class="mb-3 d-flex align-items-center">
            <label class="form-label me-2 mb-0" style="width: 100px;">佣金比例</label>
            <input type="text" id="modalCommission" class="form-control form-control-sm">
          </div>
          <button class="btn btn-success btn w-100 mb-3" id="modalSaveBtn">更改</button>

          <h3>订单列表</h3>
          <hr>
          <div class="d-flex justify-content-end mb-2">
            <button class="btn btn-success btn-sm" id="addOrderBtn">新增订单</button>
          </div>
          <!-- 订单表格 -->
          <div class="table-responsive">
            <table class="table table-dark table-bordered table-sm table-hover align-middle">
              <thead>
                <tr>
                  <th>#</th>
                  <th class="text-nowrap text-center">产品照片</th>
                  <th class="text-nowrap text-center">产品名称</th>
                  <th class="text-nowrap text-center">产品价格</th>
                  <th class="text-nowrap text-center">完成时间</th>
                  <th class="text-nowrap text-center">佣金比例</th>
                  <th class="text-nowrap text-center">佣金</th>
                  <th class="text-nowrap text-center" style="min-width:80px">操作</th>
                </tr>
              </thead>
              <tbody id="modalOrdersBody">
                <tr><td colspan="8" class="text-center">暂无订单</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Team Modal -->
  <div class="modal fade" id="teamModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-bottom border-secondary">
          <h5 class="modal-title">团队信息 <small id="teamOwner" class="text-muted"></small></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="table-responsive">
            <table class="table table-dark table-striped text-center mb-0">
              <thead>
                <tr>
                  <th>用户名</th>
                  <th>VIP</th>
                  <th>佣金</th>
                </tr>
              </thead>
              <tbody id="teamTableBody">
                <tr><td colspan="3" class="text-center text-muted">等待加载</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Check-in Modal -->
  <div class="modal fade" id="checkInModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-bottom border-secondary">
          <h5 class="modal-title">签到记录 <small id="checkinUser" class="text-muted"></small></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <ul id="checkinList" class="list-group list-group-flush">
            <li class="list-group-item bg-dark text-muted">等待加载</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Reset Cycle Modal -->
  <div class="modal fade" id="confirmResetModal" tabindex="-1" aria-labelledby="confirmResetModalLable" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-bottom border-secondary">
          <h5 class="modal-title" id="resetCycleModalLabel">重置任务</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>是否立即重置任务？<br>
          关闭后将<strong>立刻分发佣金并创建新任务</strong>。</p>
        </div>
        <div class="modal-footer border-top border-secondary">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">取消</button>
          <button type="button" id="confirmResetBtn" class="btn btn-danger">确认重置</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-bottom border-secondary">
          <h5 class="modal-title" id="confirmDeleteModalLabel">确定删除</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>您确定要删除吗?</p>
        </div>
        <div class="modal-footer border-top border-secondary">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">取消</button>
          <button type="button" id="confirmDeleteBtn" class="btn btn-danger">删除</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Demo Modal -->
  <div class="modal fade" id="createDemoModal" tabindex="-1" aria-labelledby="createDemoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-bottom border-secondary">
          <h5 class="modal-title" id="createDemoModalLabel">创建测试账号</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form id="createDemoForm">
          <div class="modal-body">

            <div class="mb-3 row">
              <label for="demoUsername" class="col-sm-4 col-form-label">用户名</label>
              <div class="col-sm-8">
                <input id="demoUsername" name="username" type="text" class="form-control bg-dark text-white border-secondary" placeholder="输入用户名">
              </div>
            </div>

            <div class="mb-3 row">
              <label for="demoPassword" class="col-sm-4 col-form-label">密码</label>
              <div class="col-sm-8">
                <input id="demoPassword" name="password" type="text" class="form-control bg-dark text-white border-secondary" placeholder="输入密码">
              </div>
            </div>

            <div class="mb-3 row">
              <label for="demoReferredBy" class="col-sm-4 col-form-label">推荐人 ID</label>
              <div class="col-sm-8">
                <input id="demoReferredBy" name="referred_by" type="text" class="form-control bg-dark text-white border-secondary" placeholder="可留空">
              </div>
            </div>

            <div class="mb-3 row">
              <label for="demoBalance" class="col-sm-4 col-form-label">余额</label>
              <div class="col-sm-8">
                <input id="demoBalance" name="balance" type="number" step="0.01" class="form-control bg-dark text-white border-secondary" placeholder="例如：1000" value="0">
              </div>
            </div>

            <div class="mb-3 row">
              <label for="demoCommissionRate" class="col-sm-4 col-form-label">佣金比率 (%)</label>
              <div class="col-sm-8">
                <input id="demoCommissionRate" name="commission_rate" type="number" step="0.01" class="form-control bg-dark text-white border-secondary" placeholder="例如：10" value="10">
              </div>
            </div>

          </div>

          <div class="modal-footer border-top border-secondary">
            <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">取消</button>
            <button type="button" id="createDemoBtn" class="btn btn-light text-dark" onclick="createDemoAccount()">创建</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    if(!token)
    {
      window.stop();
      window.location.href = `${window.location.origin}/index.html`;
    }

    const decoded_token = jwt_decode(token);
    if (decoded_token.exp < Math.floor(Date.now() / 1000) || (decoded_token.userType !== 0 && decoded_token.userType !== 1))
    {
      localStorage.removeItem('token');
      window.location.href = '/index.html';
      window.stop()
    }

    axios.get(`${window.location.origin}/users`, {
      headers: { Authorization: `Bearer ${token}` }
    })
    .then(res => {
      if (!res.data.status) return;

      const users = res.data.data;
      const tbody = document.getElementById('userBody');
      if (!tbody) return;

      let html = '';

      for (let i = 0; i < users.length; i++) {
        const user = users[i];

        const statusClass = user.status ? 'btn-success' : 'btn-danger';
        const statusText = user.status ? '启用' : '禁用';

        const canWithdrawClass = user.can_withdraw ? 'btn-success' : 'btn-danger';
        const canWithdrawText = user.can_withdraw ? '允许提现' : '禁止提现';

        const canDoTaskClass = user.can_do_task ? 'btn-success' : 'btn-danger';
        const canDoTaskText = user.can_do_task ? '允许交易' : '禁止交易';

        const isDemo = user.is_demo === true ? '<span class="badge bg-info text-dark">DEMO</span>' : '';

        const createdDate = new Date(new Date(user.created_at).getTime() + 8 * 60 * 60 * 1000);
        html += `
          <tr>
            <td>${user.id}</td>
            <td>${user.username} ${isDemo} </td>
            <td><span class="badge bg-warning text-dark">${user.vip_level}</span></td>
            <td>${user.credit_score}</td>
            <td>${parseFloat(user.balance).toFixed(2)}</td>
            <td class="text-nowrap">
              <button class="btn ${statusClass} btn-sm statusBtn" data-id="${user.id}" data-field="status">${statusText}</button>
              <button class="btn ${canWithdrawClass} btn-sm statusBtn" data-id="${user.id}" data-field="can_withdraw">${canWithdrawText}</button>
              <button class="btn ${canDoTaskClass} btn-sm statusBtn" data-id="${user.id}" data-field="can_do_task">${canDoTaskText}</button>
            </td>
            <td> ${user.completion_ratio} </td>
            <td class="text-nowrap">
            <button 
              class="btn btn-sm btn-warning text-dark me-1" 
              data-bs-toggle="modal" 
              data-bs-target="#editUserModal"
              data-id="${user.id}"
              data-username="${user.username}"
              data-referral-code="${user.referral_code}"
              data-vip-level="${user.vip_level}"
              data-credit-score="${user.credit_score}"
              data-balance="${user.balance}"
              data-password="${user.password || ''}"
              data-security-pin="${user.security_pin || ''}"
              data-phone="${user.phone || ''}"
              data-email="${user.email || ''}"
              data-gender="${user.gender || ''}"
              data-dob="${user.dob || ''}">
              基本资料
            </button>

            <button 
              class="btn btn-sm btn-info me-1" 
              data-bs-toggle="modal" 
              data-bs-target="#cycleOrdersModal"
              data-id="${user.id}">
              订单设置
            </button>

            <button 
              class="btn btn-sm btn-light me-1" 
              data-bs-toggle="modal" 
              data-bs-target="#teamModal"
              data-id="${user.id}"
              data-username="${user.username}">
              查看团队
            </button>

            <button 
              class="btn btn-sm btn-secondary me-1" 
              data-bs-toggle="modal" 
              data-bs-target="#checkInModal"
              data-id="${user.id}"
              data-username="${user.username}">
              签到记录
            </button>

            <button 
              class="btn btn-sm btn-warning" 
              data-bs-toggle="modal" 
              data-bs-target="#confirmResetModal" 
              data-id="${user.id}">
              重置任务
            </button>

            <button 
              class="btn btn-sm btn-danger me-1" 
              data-bs-toggle="modal" 
              data-bs-target="#confirmDeleteModal" 
              data-id="${user.id}">
              删除用户
            </button>
          </td>
          </tr>
        `;
      }

      tbody.innerHTML = html;

      document.querySelectorAll('.statusBtn').forEach(btn => {
        btn.addEventListener('click', () => {
          const userId = btn.dataset.id;
          const field = btn.dataset.field;
          const newValue = !btn.classList.contains('btn-success');

          axios.patch(`${window.location.origin}/user/${userId}`, { [field]: newValue }, {
            headers: { Authorization: `Bearer ${token}` }
          })
          .then(() => {
            btn.classList.toggle('btn-success', newValue);
            btn.classList.toggle('btn-danger', !newValue);

            let text = '';
            if (field === 'status') text = newValue ? '启用' : '禁用';
            if (field === 'can_withdraw') text = newValue ? '允许提现' : '禁止提现';
            if (field === 'can_do_task') text = newValue ? '允许交易' : '禁止交易';

            btn.textContent = text;
          })
          .catch(err => console.error('Update failed:', err));
        });
      });
    })
    .catch(err => console.error('User load failed:', err));

    const editModal = document.getElementById('editUserModal');
    editModal.addEventListener('show.bs.modal', event => {
      const button = event.relatedTarget
      document.getElementById('editSaveBtn').dataset.id = button.dataset.id

      document.getElementById('editCreditScore').value = button.dataset.creditScore || ''
      document.getElementById('editUserBalance').value = parseFloat(button.dataset.balance || 0).toFixed(2);

      document.getElementById('editSecurityPin').value = button.dataset.securityPin || ''
      document.getElementById('editUserPhone').value = button.dataset.phone || ''

    document.getElementById('sidebarToggle').addEventListener('click', function() {window.scrollTo(0, 0);});

    const cycleOrdersModal = document.getElementById('cycleOrdersModal');
    cycleOrdersModal.addEventListener('show.bs.modal', function (event) {
      const userId = parseInt(event.relatedTarget.dataset.id);
      this.dataset.userId = userId;
      const ordersBody = document.getElementById('modalOrdersBody');
      const token = localStorage.getItem('token');

      ordersBody.innerHTML = `<tr><td colspan="10" class="text-center">正在加载订单...</td></tr>`;

      axios.get(`/cycles?userId=${userId}`, {
        headers: { Authorization: `Bearer ${token}` }
      }).then(res => {
        const activeCycle = (res.data.data || [])[0];

        if (!activeCycle) {
          ordersBody.innerHTML = `<tr><td colspan="10" class="text-center text-warning">该用户没有进行中的任务环</td></tr>`;
          return;
        }

        // 预填设置
        document.getElementById('modalCycleSize').value = activeCycle.cycle_size || '';
        document.getElementById('modalBlockers').value = (activeCycle.blocker_indexes || []).join(',');
        document.getElementById('modalCommission').value = activeCycle.commission_rate || 0;

        currentModalCycleId = activeCycle.id;

        // 填充订单表格
        const orders = activeCycle.orders || [];
        if (orders.length === 0) {
          ordersBody.innerHTML = `<tr><td colspan="10" class="text-center text-warning">暂无订单</td></tr>`;
          return;
        }

        let html = orders.map((o, index) => {
          const amount = Number(o.amount || 0);
          const commission = Number(o.commission || 0);
          const ratePct = amount ? (commission / amount * 100) : 0;
          const completedText = o.completed_at ? new Date(o.completed_at).toLocaleString() : '未完成';
          const imgHtml = o.image_url
            ? `<img src="${o.image_url}" class="img-thumbnail" style="width:48px;height:48px;object-fit:cover;">`
            : `<span class="text-muted">-</span>`;

          return `
            <tr data-id="${o.id}">
              <td class='text-center'>${index + 1}</td>
              <td class='text-center'>${imgHtml}</td>
              <td class='text-center'>${o.product_name || '-'}</td>
              <td class='text-center'>${amount.toFixed(2)}</td>
              <td class='text-center'>${completedText}</td>
              <td class='text-center'>${ratePct.toFixed(2)}%</td>
              <td class='text-center'>${commission.toFixed(2)}</td>
              <td class='text-center'>
                <button class="btn btn-outline-warning btn-sm" onclick="makeRowEditable(this)">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button class="btn btn-outline-danger btn-sm" onclick="deleteOrder(${o.id})">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          `;
        }).join('');

        html += `
          <tr class="table-success fw-bold">
            <td colspan="6" class="text-end">累计佣金</td>
            <td colspan="2">${Number(activeCycle.commission_amount || 0).toFixed(2)}</td>
          </tr>
        `;

        ordersBody.innerHTML = html;
      }).catch(err => {
        console.error(err);
        ordersBody.innerHTML = `<tr><td colspan="10" class="text-center text-danger">加载订单失败</td></tr>`;
      });
    });

    document.getElementById('addOrderBtn').addEventListener('click', () => {
      if (!currentModalCycleId) return alert("没有选中的任务环");

      const productId = prompt("请输入产品ID");
      if (!productId) return;

      const token = localStorage.getItem('token');

      axios.post(`/cycles/${currentModalCycleId}/orders`, { productId: parseInt(productId, 10) }, {
        headers: { Authorization: `Bearer ${token}` }
      }).then(res => {
        if (res.data.status) {
          alert("订单添加成功");
          location.reload();
        } else {
          alert(res.data.message || "添加失败");
        }
      }).catch(err => {
        console.error(err);
        alert("添加失败，请检查控制台");
      });
    });

    const teamModal = document.getElementById('teamModal');
    teamModal.addEventListener('show.bs.modal', async function (event) {
      const button = event.relatedTarget;
      const userId = button.getAttribute('data-id');
      const username = button.getAttribute('data-username');

      const tbody = teamModal.querySelector('#teamTableBody');
      const owner = teamModal.querySelector('#teamOwner');
      const totalCommEl = document.getElementById('totalCommissionValue');

      if (owner) owner.textContent = `（${username}）`;
      tbody.innerHTML = `<tr><td colspan="3" class="text-muted">加载中...</td></tr>`;
      if (totalCommEl) totalCommEl.textContent = '$0.00';

      try {
        const { data } = await axios.get(`${window.location.origin}/team/${userId}`, {
          headers: { Authorization: `Bearer ${token}` }
        });

        const list = data?.data || [];
        if (!list.length) {
          tbody.innerHTML = `<tr><td colspan="3" class="text-muted">暂无团队成员</td></tr>`;
          return;
        }

        let total = 0;
        tbody.innerHTML = list.map(m => {
          const amt = Number(m.commission_amount) || 0;
          total += amt;
          return `
            <tr>
              <td>${m.username}</td>
              <td>${m.vip_level || '-'}</td>
              <td>$${amt.toFixed(2)}</td>
            </tr>
          `;
        }).join('');

        if (totalCommEl) totalCommEl.textContent = `$${total.toFixed(2)}`;
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-danger">加载失败</td></tr>`;
      }
    });
    
    const checkInModal = document.getElementById('checkInModal');

    function editUser() {

    function makeRowEditable(btn) {
      const row = btn.closest('tr');
      const id = row.dataset.id;
      const cells = row.querySelectorAll('td');
      const table = row.closest('table');

      // 保存原始内容
      row.dataset.originalAmount = cells[3].textContent.trim();
      row.dataset.originalRate = cells[5].textContent.trim();
      row.dataset.originalCommission = cells[6].textContent.trim();

      // 可编辑字段
      const amountCell = cells[3];
      const commissionRateCell = cells[5];
      const commissionCell = cells[6];

      const originalAmount = parseFloat(row.dataset.originalAmount) || 0;
      const originalRate = parseFloat(row.dataset.originalRate) || 0;

      // helper: 重新计算佣金并更新单元格
      function recalcCommission() {
        const amount = parseFloat(row.querySelector('td:nth-child(4) input').value) || 0;
        const rate = parseFloat(row.querySelector('td:nth-child(6) input').value) || 0;
        const commission = amount * rate / 100;
        commissionCell.textContent = commission.toFixed(2);

        // 更新总计
        updateCycleCommission(table);
      }

      amountCell.innerHTML = `
        <input type="number" step="0.01" class="form-control form-control-sm"
              value="${originalAmount}" oninput="this.closest('tr').recalcCommission()">
      `;

      commissionRateCell.innerHTML = `
        <input type="number" step="0.01" class="form-control form-control-sm"
              value="${originalRate}" oninput="this.closest('tr').recalcCommission()">
      `;

      // 把函数挂到当前行，oninput 可用
      row.recalcCommission = recalcCommission;

      // 替换按钮
      cells[7].innerHTML = `
        <button class="btn btn-outline-success btn-sm" onclick="saveRow(this, '${id}')">
          <i class="bi bi-check-lg"></i>
        </button>
        <button class="btn btn-outline-danger btn-sm" onclick="cancelEdit(this)">
          <i class="bi bi-x-lg"></i>
        </button>
      `;
    }

    function saveRow(btn, id) {
      const row = btn.closest('tr');
      const inputs = row.querySelectorAll('input');
      const newAmount = parseFloat(inputs[0].value) || 0;
      const newRate = parseFloat(inputs[1].value) || 0;

      // 计算新佣金
      const newCommission = newAmount * newRate / 100;

      axios.put(`/orders/${id}`, {
        amount: newAmount,
        commission_rate: newRate
      }, {
        headers: { Authorization: `Bearer ${localStorage.getItem('token')}` }
      }).then(res => {
        // 更新表格
        row.querySelectorAll('td')[3].textContent = newAmount.toFixed(2);
        row.querySelectorAll('td')[5].textContent = newRate.toFixed(2);
        row.querySelectorAll('td')[6].textContent = newCommission.toFixed(2);

        // 按钮复原
        row.querySelectorAll('td')[7].innerHTML = `
          <button class="btn btn-outline-warning btn-sm" onclick="makeRowEditable(this)">
            <i class="bi bi-pencil-square"></i>
          </button>
          <button class="btn btn-outline-danger btn-sm" onclick="deleteOrder(${id})">
            <i class="bi bi-trash"></i>
          </button>
        `;

        // 同步刷新 cycle 总佣金
        updateCycleCommission(row.closest('table'));
      }).catch(err => {
        console.error(err);
        alert('保存失败');
      });
    }

    function cancelEdit(btn) {
      const row = btn.closest('tr');
      const cells = row.querySelectorAll('td');

      // 还原原始值
      cells[3].textContent = row.dataset.originalAmount;
      cells[5].textContent = row.dataset.originalRate;
      cells[6].textContent = row.dataset.originalCommission;
      
      cells[7].innerHTML = `
        <button class="btn btn-outline-warning btn-sm" onclick="makeRowEditable(this)">
          <i class="bi bi-pencil-square"></i>
        </button>
        <button class="btn btn-outline-danger btn-sm" onclick="deleteOrder(${row.dataset.id})">
          <i class="bi bi-trash"></i>
        </button>
      `;
    }

    function updateCycleCommission(table) {
      const rows = table.querySelectorAll('tbody tr');
      let total = 0;
      rows.forEach(r => {
        const cells = r.querySelectorAll('td');
        if (cells.length >= 7 && !r.classList.contains('table-success')) {
          const completedText = cells[4]?.textContent?.trim() || "";
          // 排除未完成
          if (completedText !== "未完成") {
            const val = parseFloat(cells[6].textContent);
            if (!isNaN(val)) total += val;
          }
        }
      });
      const summaryRow = table.querySelector('tr.table-success td:last-child');
      if (summaryRow) summaryRow.textContent = total.toFixed(2);
    }

      localStorage.removeItem("token");
      window.location.href = "index.html";
    }
  </script>
