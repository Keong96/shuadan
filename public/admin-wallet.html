<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>钱包查询</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  <style>
    body {
      margin: 0;
      padding-top: 56px;
      font-family: system-ui, sans-serif;
      background-color: #1e1e2f;
      color: #f0f0f0;
    }

    .navbar {
      background-color: #27293d;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .navbar-brand {
      color: #f0f0f0;
    }

    .navbar-toggler {
      border-color: rgba(255, 255, 255, 0.4);
    }

    .navbar-toggler-icon {
      filter: invert(1);
    }

    .wrapper {
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 992px) {
      .wrapper {
        flex-direction: row;
      }
    }

    .sidebar {
      background-color: #2c2f48;
      border-bottom: 1px solid #333;
    }

    @media (min-width: 992px) {
      .sidebar {
        position: sticky;
        top: 56px;
        height: calc(100vh - 56px);
        width: 250px;
        border-right: 1px solid #333;
        overflow-y: auto;
      }
    }

    .sidebar .nav-link {
      color: #ccc;
      margin: 0.5rem 0;
    }

    .sidebar .nav-link.active,
    .sidebar .nav-link:hover {
      background-color: #3e4161;
      color: #fff;
      border-radius: 5px;
    }

    .main-content {
      flex-grow: 1;
      padding: 20px;
      background-color: #1e1e2f;
    }

    .card {
      background-color: #2a2d45;
      border: none;
      color: #fff;
    }

    .btn-primary {
      background-color: #5c6bc0;
      border-color: #5c6bc0;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #3f51b5;
      border-color: #3f51b5;
    }
    input[readonly] {
      border: 0 !important;
      box-shadow: none !important;
      background-color: transparent; /* 可选，若你不想要背景 */
    }
  </style>
</head>
<body>
   <nav class="navbar navbar-expand-lg px-4">
    <a class="navbar-brand text-white" href="index.html">钱包查询</a>
    <button
      class="navbar-toggler ms-auto"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#sidebarMenu"
      aria-controls="sidebarMenu"
      aria-expanded="false"
      aria-label="Toggle sidebar"
      id="sidebarToggle"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
  </nav>

  <div class="wrapper">
    <div class="sidebar collapse d-lg-block" id="sidebarMenu">
      <nav class="nav flex-column px-3 pt-4">
        <a class="nav-link" href="admin-dashboard.html"><i class="bi bi-speedometer2 me-2"></i>控制面板</a>
        <a class="nav-link" href="/admin-user.html"><i class="bi bi-people me-2"></i>用户管理</a>
        <a class="nav-link" href="/admin-task.html"><i class="bi bi-box-seam me-2"></i>产品管理</a>
        <a class="nav-link" href="/admin-transaction.html"><i class="bi bi-bank me-2"></i>交易明细</a>
        <a class="nav-link" href="/admin-withdraw.html"><i class="bi bi-cash-stack me-2"></i>提现记录</a>
        <a class="nav-link" href="/admin-loan.html"><i class="bi bi-cash me-2"></i>贷款申请</a>
        <a class="nav-link" href="/admin-draw-record.html"><i class="bi bi-gift-fill me-2"></i>抽奖记录</a>
        <a class="nav-link active" href="/admin-wallet.html"><i class="bi bi-wallet me-2"></i>钱包查询</a>
        <a class="nav-link" href="/admin-tnc-edit.html"><i class="bi bi-file-earmark-text me-2"></i>规则编辑</a>
        <a class="nav-link" href="/admin-setting.html"><i class="bi bi-receipt me-2"></i>全局设定</a>
        <a class="nav-link" href="#" onclick="Logout()"><i class="bi bi-box-arrow-right me-2"></i>登出</a>
      </nav>
    </div>

    <div class="main-content">
      <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="mb-0">钱包查询</h3>
        </div>

        <div class="card p-3">
          <form id="walletSearchForm" class="row g-3 align-items-end">
            <div class="col-auto">
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="searchBy" id="searchWallet" value="wallet" checked>
                <label class="form-check-label" for="searchWallet">钱包地址</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="searchBy" id="searchUsername" value="username">
                <label class="form-check-label" for="searchUsername">用户名</label>
            </div>
            </div>

            <div class="col-auto flex-grow-1">
            <label for="searchInput" class="form-label visually-hidden">搜索</label>
            <input type="text" id="searchInput" class="form-control">
            </div>

            <div class="col-auto">
            <button type="submit" class="btn btn-primary">Search</button>
            </div>
          </form>

          <hr>

          <div id="searchResult" class="mt-3">
              <!-- User info will appear here -->
          </div>
        </div> 
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    if (!token) location.href = '/index.html';

    const decoded_token = jwt_decode(token);
    if (decoded_token.exp < Math.floor(Date.now() / 1000) || (decoded_token.userType !== 0 && decoded_token.userType !== 1))
    {
      localStorage.removeItem('token');
      window.location.href = '/index.html';
      window.stop()
    }

    const form = document.getElementById('walletSearchForm');
    const input = document.getElementById('searchInput');
    const resultDiv = document.getElementById('searchResult');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const searchBy = document.querySelector('input[name="searchBy"]:checked').value;
      const query = input.value.trim();
      if (!query) return alert('Please enter a value');

      try {
        const res = await axios.get(`/wallet/search`, {
          params: { [searchBy]: query },
          headers: { Authorization: `Bearer ${localStorage.getItem('token')}` }
        });

        const users = res.data.data || [];
        if (!users.length) {
          resultDiv.innerHTML = `<p class="text-warning">未找到用户</p>`;
          return;
        }

        // 构建表格显示多条结果
        let html = `<table class="table table-dark table-bordered table-sm mt-2">
          <thead>
            <tr>
              <th>ID</th>
              <th>用户名</th>
              <th>钱包地址 / 联络号码</th>
            </tr>
          </thead>
          <tbody>`;

        users.forEach(u => {
          html += `<tr>
            <td>${u.id}</td>
            <td>${u.username}</td>
            <td>${u.phone}</td>
          </tr>`;
        });

        html += `</tbody></table>`;
        resultDiv.innerHTML = html;

      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `<p class="text-danger">Server Error</p>`;
      }
    });
    
    function Logout() {
      localStorage.removeItem('token');
      location.href = 'index.html';
    }

  </script>
</body>
</html>
