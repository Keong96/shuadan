<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>贷款申请</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding-top: 56px;
      font-family: system-ui, sans-serif;
      background-color: #1e1e2f;
      color: #f0f0f0;
    }

    .navbar {
      background-color: #27293d;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .navbar-brand {
      color: #f0f0f0;
    }

    .navbar-toggler {
      border-color: rgba(255, 255, 255, 0.4);
    }

    .navbar-toggler-icon {
      filter: invert(1);
    }

    .wrapper {
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 992px) {
      .wrapper {
        flex-direction: row;
      }
    }

    .sidebar {
      background-color: #2c2f48;
      border-bottom: 1px solid #333;
    }

    @media (min-width: 992px) {
      .sidebar {
        position: sticky;
        top: 56px;
        height: calc(100vh - 56px);
        width: 250px;
        border-right: 1px solid #333;
        overflow-y: auto;
      }
    }

    .sidebar .nav-link {
      color: #ccc;
      margin: 0.5rem 0;
    }

    .sidebar .nav-link.active,
    .sidebar .nav-link:hover {
      background-color: #3e4161;
      color: #fff;
      border-radius: 5px;
    }

    .main-content {
      flex-grow: 1;
      padding: 20px;
      background-color: #1e1e2f;
    }

    .card {
      background-color: #2a2d45;
      border: none;
      color: #fff;
    }

    .btn-primary {
      background-color: #5c6bc0;
      border-color: #5c6bc0;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #3f51b5;
      border-color: #3f51b5;
    }
    input[readonly] {
      border: 0 !important;
      box-shadow: none !important;
      background-color: transparent; /* 可选，若你不想要背景 */
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg px-4">
    <a class="navbar-brand" href="index.html">贷款申请</a>
    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
  </nav>

  <div class="wrapper">
    <div class="sidebar collapse d-lg-block" id="sidebarMenu">
      <nav class="nav flex-column px-3 pt-4">
        <a class="nav-link" href="admin-dashboard.html"><i class="bi bi-speedometer2 me-2"></i>控制面板</a>
        <a class="nav-link" href="/admin-user.html"><i class="bi bi-people me-2"></i>用户管理</a>
        <a class="nav-link" href="/admin-task.html"><i class="bi bi-list-task me-2"></i>任务模版</a>
        <a class="nav-link" href="/admin-transaction.html"><i class="bi bi-bank me-2"></i>交易明细</a>
        <a class="nav-link active" href="/admin-loan.html"><i class="bi bi-cash me-2"></i>贷款申请</a>
        <a class="nav-link" href="/admin-wallet.html"><i class="bi bi-wallet me-2"></i>钱包查询</a>
        <a class="nav-link" href="/admin-setting.html"><i class="bi bi-gear me-2"></i>全局设定</a>
        <a class="nav-link" href="#" onclick="Logout()"><i class="bi bi-box-arrow-right me-2"></i>登出</a>
      </nav>
    </div>

  <div class="main-content">
    <div class="container-fluid">
      <h3 class="mb-4">贷款申请管理</h3>

      <div class="card p-3">
        <div class="table-responsive">
          <table class="table table-dark table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>#</th>
                <th>用户名</th>
                <th>数额</th>
                <th>日期</th>
                <th>备注</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="loanBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-bottom border-secondary">
          <h5 class="modal-title">确定删除</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body"><p>您确定要删除这条贷款申请吗？</p></div>
        <div class="modal-footer border-top border-secondary">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">取消</button>
          <button type="button" id="confirmDeleteBtn" class="btn btn-danger">删除</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/index.html'; window.stop(); }

    const decoded_token = jwt_decode(token);
    if (decoded_token.exp < Math.floor(Date.now() / 1000) || (decoded_token.userType !== 0 && decoded_token.userType !== 1)) {
      localStorage.removeItem('token'); window.location.href = '/index.html'; window.stop();
    }

    const confirmDeleteModal = document.getElementById('confirmDeleteModal');
    confirmDeleteModal.addEventListener('show.bs.modal', function(event) {
      const btn = event.relatedTarget;
      if (!btn) return;
      document.getElementById('confirmDeleteBtn').dataset.id = btn.getAttribute('data-id');
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', async function() {
      const id = this.dataset.id;
      try {
        await axios.delete(`/loans/${id}`, { headers: { Authorization: `Bearer ${token}` } });
        bootstrap.Modal.getInstance(confirmDeleteModal).hide();
        loadLoans();
      } catch (err) { alert('删除失败'); }
    });

    async function loadLoans() {
      try {
        const res = await axios.get('/loan-requests', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const tbody = document.getElementById('loanBody');
        tbody.innerHTML = '';

        const statusTextMap = {
          APPROVED: 'Approved',
          REJECTED: 'Rejected',
          PENDING: 'Pending'
        };
        const statusClassMap = {
          APPROVED: 'btn-success',
          REJECTED: 'btn-danger',
          PENDING: 'btn-secondary'
        };

        res.data.data.forEach((l, i) => {
          const date = (l.created_at || '').split('T')[0];

          const statusCell = (l.status === 'PENDING')
            ? `
              <button class="btn btn-sm btn-outline-success me-1" onclick="updateLoan(${l.id}, 'APPROVED')">
                <i class="bi bi-check-lg"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" onclick="updateLoan(${l.id}, 'REJECTED')">
                <i class="bi bi-x-lg"></i>
              </button>
            `
            : `
              <span class="btn ${statusClassMap[l.status]} fs-6 py-2 px-3 d-inline-flex align-items-center justify-content-center">
                ${statusTextMap[l.status] || l.status}
              </span>
            `;

          tbody.innerHTML += `
            <tr>
              <td>${i + 1}</td>
              <td>${l.username || '-'}</td>
              <td class="text-warning">${Number(l.amount).toFixed(2)}</td>
              <td>${date}</td>
              <td style="max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${l.remark || ''}">
                ${l.remark || ''}
              </td>
              <td>${statusCell}</td>
            </tr>
          `;
        });
      } catch (err) {
        console.error('Failed to load /loan-requests', err);
      }
    }

    async function updateLoan(id, status) {
      try {
        await axios.patch(`/loan-requests/${id}`, { status }, {
          headers: { Authorization: `Bearer ${token}` }
        });
        loadLoans(); // 刷新列表，按钮消失
      } catch (err) {
        console.error(`Failed to update loan ${id} to ${status}`, err);
      }
    }

    function Logout() {
      localStorage.removeItem('token');
      window.location.href = '/index.html';
    };

    loadLoans();
  </script>
</body>
</html>
