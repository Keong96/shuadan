<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>规则编辑 - 管理后台</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>

  <style>
    body {
      margin: 0; padding-top: 56px;
      font-family: system-ui, sans-serif;
      background-color: #1e1e2f; color: #f0f0f0;
    }
    .navbar { background-color: #27293d; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; }
    .wrapper { display: flex; flex-direction: column; }
    @media (min-width: 992px) { .wrapper { flex-direction: row; } }
    .sidebar { background-color: #2c2f48; border-bottom: 1px solid #333; }
    @media (min-width: 992px) {
      .sidebar { position: sticky; top: 56px; height: calc(100vh - 56px); width: 250px; border-right: 1px solid #333; }
    }
    .sidebar .nav-link { color: #ccc; margin: 0.5rem 0; }
    .sidebar .nav-link.active { background-color: #3e4161; color: #fff; border-radius: 5px; }
    .main-content { flex-grow: 1; padding: 20px; background-color: #1e1e2f; }
    .card { background-color: #2a2d45; border: none; color: #fff; }

    #editor-container {
      height: 600px;
      background-color: #fff;
      color: #333;
      border-bottom-left-radius: 1rem;
      border-bottom-right-radius: 1rem;
    }
    .ql-toolbar {
      background-color: #eee;
      border-top-left-radius: 1rem;
      border-top-right-radius: 1rem;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg px-4">
    <a class="navbar-brand text-white" href="#">规则编辑</a>
  </nav>

  <div class="wrapper">
    <!-- Sidebar -->
    <div class="sidebar collapse d-lg-block" id="sidebarMenu">
      <nav class="nav flex-column px-3 pt-4">
        <a class="nav-link" href="admin-dashboard.html"><i class="bi bi-speedometer2 me-2"></i>控制面板</a>
        <a class="nav-link" href="/admin-user.html"><i class="bi bi-people me-2"></i>用户管理</a>
        <a class="nav-link" href="/admin-task.html"><i class="bi bi-box-seam me-2"></i>产品管理</a>
        <a class="nav-link" href="/admin-transaction.html"><i class="bi bi-bank me-2"></i>交易明细</a>
        <a class="nav-link" href="/admin-withdraw.html"><i class="bi bi-cash-stack me-2"></i>提现记录</a>
        <a class="nav-link" href="/admin-loan.html"><i class="bi bi-cash me-2"></i>贷款申请</a>
        <a class="nav-link" href="/admin-draw-record.html"><i class="bi bi-gift-fill me-2"></i>抽奖记录</a>
        <a class="nav-link" href="/admin-wallet.html"><i class="bi bi-wallet me-2"></i>钱包查询</a>
        <a class="nav-link active" href="/admin-tnc-edit.html"><i class="bi bi-file-earmark-text me-2"></i>规则编辑</a>
        <a class="nav-link" href="/admin-setting.html"><i class="bi bi-receipt me-2"></i>全局设定</a>
        <a class="nav-link" href="#" onclick="Logout()"><i class="bi bi-box-arrow-right me-2"></i>登出</a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="container-fluid">
        <h3 class="mb-4">修改 T&C 条款</h3>

        <div class="card p-4 shadow">
          <div class="row mb-4">
            <div class="col-md-4">
              <label class="form-label text-secondary">选择语言</label>
              <select id="langSelect" class="form-select bg-dark text-white border-secondary" onchange="loadTncData()">
                <option value="en">English</option>
                <option value="cs">Czech</option>
                <option value="de">German</option>
                <option value="fr">French</option>
              </select>
            </div>
            <div class="col-md-8 d-flex align-items-end justify-content-end">
              <button class="btn btn-success btn-lg px-5" onclick="saveTncData()">
                <i class="bi bi-check-circle me-2"></i>保存修改
              </button>
            </div>
          </div>

          <div id="editor-wrapper">
             <div id="editor-container"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const quill = new Quill('#editor-container', {
      theme: 'snow',
      modules: {
        toolbar: [
          [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
          ['bold', 'italic', 'underline'],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          [{ 'color': [] }, { 'background': [] }],
          ['clean']
        ]
      }
    });

    // 加载 TNC 数据
    async function loadTncData() {
      const lang = document.getElementById('langSelect').value;
      try {
        const { data: res } = await axios.get(`${window.location.origin}/admin/tnc/${lang}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        
        if (res.status) {
          quill.root.innerHTML = res.data;
        } else {
          alert("加载失败");
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function saveTncData() {
      const lang = document.getElementById('langSelect').value;
      const content = quill.root.innerHTML;

      if (!confirm(`确定要更新 [${lang}] 的内容吗？`)) return;

      try {
        const { data: res } = await axios.post(`${window.location.origin}/admin/tnc/${lang}`, 
          { content: content }, 
          { headers: { Authorization: `Bearer ${token}` } }
        );
        
        if (res.status) {
          alert("保存成功！已实时生效。");
        } else {
          alert("保存失败");
        }
      } catch (err) {
        alert("提交失败");
      }
    }

    function Logout() {
      localStorage.removeItem('token');
      window.location.href = '/index.html';
    }

    // 初始化加载
    window.onload = loadTncData;
  </script>
</body>
</html>
